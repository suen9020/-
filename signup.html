<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사업자 가입 — MAIND (마인드)</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo" aria-label="MAIND 홈">
        <span class="logo-mark">M</span>
        <span class="logo-text">
          <span class="logo-text-en">MAIND</span>
          <span class="logo-text-ko">마인드</span>
        </span>
      </a>
      <nav class="nav">
        <a href="index.html">홈</a>
        <a href="brand.html">브랜드 소개</a>
        <a href="order.html">청소 신청</a>
        <a href="my-orders.html">주문 조회</a>
        <a href="history.html">작업 히스토리</a>
        <a href="login.html">로그인</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="form-card" style="max-width:520px;">
      <h2>사업자 가입</h2>
      <p class="subtitle">가입 후 관리자 승인이 완료되면 대시보드를 사용하실 수 있어요.</p>

      <form id="signup-form" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="businessName">업체명<span class="req">*</span></label>
            <input type="text" id="businessName" required maxlength="40" placeholder="○○클린">
          </div>
          <div class="form-group">
            <label for="ownerName">대표자명<span class="req">*</span></label>
            <input type="text" id="ownerName" required maxlength="20" placeholder="홍길동">
          </div>
        </div>

        <div class="form-group">
          <label for="phone">연락처<span class="req">*</span></label>
          <input type="tel" id="phone" required placeholder="010-1234-5678">
        </div>

        <div class="form-group">
          <label for="bizRegNo">사업자 등록번호 / 법인 등록번호<span class="req">*</span></label>
          <input type="text" id="bizRegNo" required maxlength="20" placeholder="123-45-67890 또는 110111-1234567">
          <span class="hint">사업자등록번호 10자리 또는 법인등록번호 13자리</span>
        </div>

        <div class="form-group">
          <label for="email">이메일<span class="req">*</span></label>
          <input type="email" id="email" required placeholder="you@example.com">
        </div>

        <div class="form-group">
          <label for="password">비밀번호<span class="req">*</span></label>
          <input type="password" id="password" required minlength="6">
          <span class="hint">최소 6자 이상</span>
        </div>

        <div class="form-group">
          <label for="password2">비밀번호 확인<span class="req">*</span></label>
          <input type="password" id="password2" required minlength="6">
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">가입 신청</button>
      </form>

      <div style="margin-top:20px; text-align:center; font-size:14px; color:var(--muted);">
        이미 계정이 있으신가요?
        <a href="login.html" style="color:var(--primary-dark); font-weight:600;">로그인하기 →</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div>© 2026 MAIND (마인드) — 깨끗해서 마음에 듭니다.</div>
  </footer>

  <script type="module" src="js/signup.js"></script>
</body>
</html>
